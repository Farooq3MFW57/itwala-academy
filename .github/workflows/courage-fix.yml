name: Courage Code Fix

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What to fix or change'
        required: true
      target_files:
        description: 'Comma-separated list of files to edit/create'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create branch
        run: |
          git checkout -b courage-fix-${{ github.run_id }}

      - name: Read target file and ask gpt-5.5 for a fix
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          TASK: ${{ inputs.task }}
          TARGET_FILES: ${{ inputs.target_files }}
        run: |
          node .github/scripts/apply-fix.js

      - name: Commit and push
        env:
          TASK: ${{ inputs.task }}
        run: |
          git config user.name "Courage Bot"
          git config user.email "courage-bot@itwala.academy"
          git add .
          git commit -m "Courage: $TASK"
          git push origin courage-fix-${{ github.run_id }}

      - name: Open Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK: ${{ inputs.task }}
        run: |
          gh pr create --title "Courage: $TASK" --body "Automated fix requested via Teams chat." --base main --head courage-fix-${{ github.run_id }}

      - name: Notify Courage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTIFY_URL: ${{ secrets.COURAGE_NOTIFY_URL }}
          TASK: ${{ inputs.task }}
        run: |
          PR_URL=$(gh pr view --json url -q .url)
          curl -X POST "$NOTIFY_URL" \
            -H "Content-Type: application/json" \
            -d "{\"task\": \"$TASK\", \"prUrl\": \"$PR_URL\"}"
