<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Reviews - ITwala Academy</title>
    <meta http-equiv="refresh" content="0; url=customer-reviews.html">
    <link rel="canonical" href="customer-reviews.html">
    <style>
        :root {
            color-scheme: light;
            --theme-accent: #f97316;
            --theme-accent-dark: #c2410c;
            --theme-text: #422006;
            --theme-muted: #7c4a21;
            --theme-border: rgba(249, 115, 22, 0.22);
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top left, rgba(251, 146, 60, 0.24), transparent 34rem), linear-gradient(135deg, #fff7ed 0%, #fffaf5 48%, #ffedd5 100%);
            color: var(--theme-text);
        }

        main {
            width: min(90vw, 34rem);
            padding: 2rem;
            border: 1px solid var(--theme-border);
            border-radius: 1.5rem;
            background: rgba(255, 255, 255, 0.84);
            box-shadow: 0 24px 70px rgba(194, 65, 12, 0.10);
            text-align: center;
        }

        p {
            color: var(--theme-muted);
        }

        a {
            color: var(--theme-accent-dark);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main>
        <p>Redirecting to <a href="customer-reviews.html">Customer Reviews</a>.</p>
    </main>
</body>
</html>
